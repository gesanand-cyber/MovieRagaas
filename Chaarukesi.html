<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaarukesi - Raaga Details</title>
  <style>
    :root {
      --bg-color: #f4f8f7;
      --card-bg: #ffffff;
      --header-bg: #4e7d77;
      --header-text: #ffffff;
      --row-alt: #f8faf9;
      --border-color: #000000;
      --link-color: #2c6e63;
      --text-dark: #2b3a37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 10px;
    }

    /* Standard Card Container */
    .container {
      max-width: 600px;
      margin: 0.5rem auto 1.5rem auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid #d5dedc;
      overflow: hidden;
    }

    .header-bar {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fff;
      border-bottom: 1px solid var(--border-color);
    }

    .header-bar h1 {
      font-size: 1.25rem;
      color: var(--header-bg);
      line-height: 1.2;
    }

    .back-btn {
      text-decoration: none;
      font-size: 0.85rem;
      color: var(--link-color);
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--link-color);
      border-radius: 6px;
      transition: all 0.2s;
      white-space: nowrap;
      margin-left: 0.5rem;
    }

    .back-btn:hover {
      background-color: var(--link-color);
      color: #fff;
    }

    .content-area {
      padding: 1rem;
    }

    .note-box {
      font-size: 0.8rem;
      color: #b00020;
      background: #fdf2f2;
      border-left: 3px solid #b0
