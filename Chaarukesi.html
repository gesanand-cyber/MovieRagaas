<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chaarukesi - Raaga Details</title>
  <style>
    :root {
      --bg-color: #f4f8f7;
      --card-bg: #ffffff;
      --header-bg: #4e7d77;
      --header-text: #ffffff;
      --row-alt: #f8faf9;
      --border-color: #e5ecea;
      --link-color: #2c6e63;
      --text-dark: #2b3a37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-dark);
    }

    /* Base desktop / regular landscape mode */
    body {
      padding: 1rem;
      overflow-x: hidden;
    }

    .container {
      max-width: 900px;
      margin: 1.5rem auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .header-bar {
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .header-bar h1 {
      font-size: 1.5rem;
      color: var(--header-bg);
    }

    .back-btn {
      text-decoration: none;
      font-size: 0.9rem;
      color: var(--link-color);
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--link-color);
      border-radius: 6px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background-color: var(--link-color);
      color: #fff;
    }

    .table-container {
      width: 100%;
      overflow-x: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      table-layout: fixed;
    }

    th, td {
      overflow-wrap: anywhere;
      word-break: normal;
    }

    thead th {
      background-color: var(--header-bg);
      color: var(--header-text);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1rem;
      letter-spacing: 0.5px;
    }

    tbody td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    tbody tr:nth-child(even) {
      background-color: var(--row-alt);
    }

    tbody tr:hover {
      background-color: #eef4f2;
    }

    .video-links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .video-links a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      background: #e4eee9;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .video-links a:hover {
      background: #c8ddd4;
      text-decoration: underline;
    }

    /* Force landscape view fitting the exact mobile screen in portrait mode */
    @media screen and (max-width: 768px) and (orientation: portrait) {
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        /* Swap width and height to match physical screen proportions */
        width: 100vh;
        width: 100dvh;
        height: 100vw;
        height: 100dvw;
        margin: 0;
        border-radius: 0;
        transform: rotate(90deg) translateY(-100%);
        transform-origin: top left;
        display: flex;
        flex-direction: column;
      }

      .header-bar {
        padding: 0.75rem 1rem;
        flex-shrink: 0;
      }

      .header-bar h1 {
        font-size: 1.2rem;
      }

      .table-container {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      thead th {
        font-size: 0.85rem;
        padding: 0.6rem 0.5rem;
      }

      tbody td {
        font-size: 0.85rem;
        padding: 0.6rem 0.5rem;
      }

      th:first-child, td:first-child {
        width: 8%;
        text-align: center;
      }

      th:nth-child(2), td:nth-child(2) {
        width: 47%;
      }

      th:nth-child(3), td:nth-child(3) {
        width: 45%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>Chaarukesi</h1>
      <a href="index.html" class="back-btn">&larr; Back to Raagas</a>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Movie Name(Year)/Song</th>
            <th style="text-align: center;">Video Links</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><b>Haridas (1944)</b><br>Manmadha Leelai</td>
            <td>
              <div style="position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px;">
                <iframe
                  src="https://www.youtube.com/embed/GUR4ZKgC6cc?playsinline=1&enablejsapi=1"
                  title="Manmadha Leelai"
                  style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen>
                </iframe>
              </div>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td><b>Saarangadhaara (1957)</b><br>Vasantha Mullai Polae Vandhu</td>
            <td>
              <div class="video-links">
                <a href="https://www.youtube.com" target="_blank">Click here</a>
              </div>
            </td>
          </tr>
          <tr>
            <td>3</td>
            <td><b>Ulle Veliyae(1993)</b><br>Sakkara Katti Sakkara Katti Sandhana Petti</td>
            <td>
              <div class="video-links">
                <a href="https://www.youtube.com" target="_blank">Click here</a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
