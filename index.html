
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Film Raaga</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-size: 12px;
    background-color: #D8F0C6;
}

/* Heading section */
.header {
    background-color: rgb(0, 128, 0);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
    text-align: center;
}

.header img {
    width: 55px;
    height: 55px;
    object-fit: contain;
}

.header h1 {
    font-size: 22px;
    margin: 0;
}

/* Selection section */
.selection {
    text-align: center;
    padding: 15px 5px;
}

select {
    width: 220px;
    max-width: 100%;
    padding: 7px;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-size: 12px;
}

/* Content iframe */
.content-frame {
    width: 100%;
    height: 80vh;
    min-height: 450px;
    border: none;
    display: block;
    background-color: "#008000";
}

@media (max-width: 600px) {
    body {
        padding: 5px;
    }

    .header {
        padding: 10px 5px;
    }

    .header img {
        width: 40px;
        height: 40px;
    }

    .header h1 {
        font-size: 18px;
    }

    .content-frame {
        height: 85vh;
        min-height: 400px;
    }
}
</style>

<script>
function loadRaga() {
    var raga = document.getElementById("ragaSelect").value;

    if (raga !== "") {
        document.getElementById("ragaFrame").src = raga + ".html";
    } else {
        document.getElementById("ragaFrame").src = "Startup.html";
    }
}
</script>

</head>

<body>

<!-- Logo and Heading -->
<div class="header">

    <img src="logo1.jpg" alt="Logo">

    <h1>Film Raaga</h1>

</div>

<!-- Raga Selection -->
<div class="selection">

    <select id="ragaSelect" onchange="loadRaga()">

        <option value="">Select</option>
        <option value="Kalyani">Kalyani</option>
        <option value="Maaya_maalava_gowlai">Maaya Maalava Gowlai</option>
        <option value="Sivaranjani">Sivaranjani</option>
        <option value="Chaarukesi">Chaarukesi</option>
        <option value="Natabhairavi">Natabhairavi</option>
        <option value="Madhyamavathi">Madhyamavathi</option>
        <option value="Simmendra_madhyamam">Simmendra Madhyamam</option>
        <option value="Shan_muga_priya">Shanmuga Priya</option>
        <option value="Sindhu_bhairavi">Sindhu Bhairavi</option>
        <option value="Shuddha_dhanyaasi">Shuddha Dhanyaasi</option>
        <option value="Karahara_priya">Karahara Priya</option>
        <option value="Hindolam">Hindolam</option>
        <option value="Harikambodhi">Harikambodhi</option>
        <option value="Shubha_bandhuvaraali">Shubha Bhandhuvaraali</option>
        <option value="Mohanam">Mohanam</option>
        <option value="Mnandha_bhairavi">Anandha Bhairavi</option>
        <option value="Kaapi">Kaapi</option>
        <option value="Dharbhaari_kanada">Dharbhaari Kanada</option>
        <option value="Bandhuvaraali">Bandhuvaraali</option>
        <option value="Gauri_manohari">Gauri Manohari</option>
        <option value="Maandu_misra_mandu">Maandu/Misra Mandu</option>
        <option value="Thilang">Thilang</option>
        <option value="Hamsadhvani">Hamsadhvani</option>
        <option value="Revathi">Revathi</option>

    </select>

</div>

<!-- Selected Raga Page -->
<iframe
    id="ragaFrame"
    class="content-frame"
    src="Startup.html"
    title="Raga Details">
</iframe>

</body>
</html>
