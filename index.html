<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raaga Explorer</title>
  <style>
    :root {
      --bg-color: #f7f9fa;
      --card-bg: #ffffff;
      --primary: #4a6fa5;
      --primary-hover: #3b5982;
      --text-dark: #2d3748;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .container {
      background: var(--card-bg);
      padding: 2rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    p {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    select {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background-color: #fff;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Raaga Directory</h1>
    <p>Select a raaga to explore compositions and video recordings.</p>

    <div class="form-group">
      <select id="raagaSelect">
        <option value="" disabled selected>-- Choose a Raaga --</option>
        <option value="Chaarukesi.html">Chaarukesi</option>
        <option value="Kalyani.html">Kalyani</option>
        <option value="Sankarabharanam.html">Sankarabharanam</option>
        <option value="Thodi.html">Thodi</option>
        <option value="Bhairavi.html">Bhairavi</option>
      </select>

      <button onclick="navigateToRaaga()">Open Page</button>
    </div>
  </div>
  <script>
    function navigateToRaaga() {
      const select = document.getElementById('raagaSelect');
      const targetPage = select.value;
      if (targetPage) {
        window.location.href = targetPage;
      } else {
        alert('Please select a raaga from the list.');
      }
    }

    // Optional: Navigate immediately upon dropdown change
    document.getElementById('raagaSelect').addEventListener('change', function() {
      if (this.value) {
        window.location.href = this.value;
      }
    });
  </script>
<footer style="
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 12px 10px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      font-size: 13px;
      color: #666;
      background-color: #f2f2f2;
      box-sizing: border-box;
      z-index: 10;
  ">
      Copyright © 2026 Anand S. All Rights Reserved.
  </footer>
</body>
</html>
